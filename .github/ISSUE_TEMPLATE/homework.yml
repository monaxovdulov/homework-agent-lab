name: Домашнее задание
description: Создать домашку для ученика и его Codex-наставника.
title: "[homework][ПОЗЫВНОЙ] "
labels:
  - role:student
  - kind:homework
  - статус:ждет-ученика 🕯️
  - help:tutor
  - privacy:public-safe
  - mode:hints-only
  - plan:required
  - attempt:required
  - checks:required
  - reflection:required
  - storage:lab-public
body:
  - type: input
    id: callsign
    attributes:
      label: Позывной ученика
      description: Публичный псевдоним ученика. Не пишите настоящее имя.
      placeholder: alpha-17
    validations:
      required: true
  - type: input
    id: topic
    attributes:
      label: Тема
      description: Короткая тема урока или домашки.
      placeholder: Функции Python, SQL JOIN, async handlers
    validations:
      required: true
  - type: textarea
    id: learning_goal
    attributes:
      label: Цель обучения
      description: Что ученик должен понять или потренировать.
      placeholder: Понять цикл, условие и возврат значения из функции.
    validations:
      required: true
  - type: textarea
    id: assignment
    attributes:
      label: Задание
      description: Что ученик должен сделать.
      placeholder: Опишите одну конкретную домашку.
    validations:
      required: true
  - type: textarea
    id: before_code
    attributes:
      label: Перед кодом
      description: Что ученик должен написать до первой строки кода.
      value: |
        1. Объяснить задачу своими словами.
        2. Написать план из 3-5 шагов.
        3. Придумать 2-3 примера входа и ожидаемого выхода.
    validations:
      required: true
  - type: textarea
    id: starter_context
    attributes:
      label: Стартовый контекст
      description: Безопасный контекст, starter files, ссылки или ограничения.
      placeholder: Не добавляйте секреты, личные данные и скрытые ответы.
    validations:
      required: false
  - type: dropdown
    id: storage
    attributes:
      label: Где хранится код ученика
      description: GitHub issue form не меняет labels динамически. По умолчанию стоит storage:lab-public; если нужен другой режим, поменяйте label после создания Issue.
      options:
        - storage:lab-public
        - storage:student-public-repo
        - storage:student-private-repo
        - storage:external-link
        - storage:no-code
      default: 0
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Проверка
      description: Как ученик должен проверить результат.
      placeholder: Примеры, тесты, ручные проверки, команды запуска.
    validations:
      required: true
  - type: textarea
    id: reflection
    attributes:
      label: Рефлексия
      description: Что ученик должен объяснить в конце.
      value: |
        1. Что получилось?
        2. Где была главная ошибка или сложность?
        3. Как я проверил решение?
        4. Что я смогу сделать сам в следующий раз?
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Режим помощи по умолчанию: `mode:hints-only`.

        Если нужен другой режим, после создания Issue измените labels вручную:
        `mode:debug`, `mode:review`, `mode:example` или `mode:reference`.
        GitHub issue form не умеет менять labels на основе поля формы.

        У учеников может быть Windows. Для команд сдачи используйте PowerShell
        scripts (`scripts/*.ps1`) или попросите Codex-наставника выбрать
        подходящий вариант.
  - type: textarea
    id: expected_result
    attributes:
      label: Ожидаемый результат
      description: Что должно быть верно, когда домашка готова к проверке?
      placeholder: Тесты проходят, функция работает, ученик написал объяснение.
    validations:
      required: true
  - type: textarea
    id: tutor_rules
    attributes:
      label: Правила для Codex-наставника
      description: Особые ограничения на помощь.
      value: |
        Codex должен помогать подсказками и объяснениями.
        До первой попытки ученика нельзя сдавать полное финальное решение.
        Перед завершением ученик должен написать короткую рефлексию.
        Если ученик на Windows, Codex должен использовать PowerShell-команды.
    validations:
      required: true
