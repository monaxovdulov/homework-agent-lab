name: Homework assignment
description: Create a homework task for the student Codex tutor workflow.
title: "[homework] "
labels:
  - role:student
  - kind:homework
  - status:queued
  - help:tutor
body:
  - type: input
    id: topic
    attributes:
      label: Topic
      description: Short lesson or homework topic.
      placeholder: Python functions, SQL joins, async handlers
    validations:
      required: true
  - type: textarea
    id: assignment
    attributes:
      label: Assignment
      description: The task the learner should complete.
      placeholder: Describe one focused assignment.
    validations:
      required: true
  - type: textarea
    id: starter_context
    attributes:
      label: Starter context
      description: Safe context, starter files, links, or constraints.
      placeholder: Do not include secrets or private personal data.
    validations:
      required: false
  - type: textarea
    id: expected_result
    attributes:
      label: Expected result
      description: What should be true when the homework is ready for review?
      placeholder: Tests pass, function behaves as described, explanation written.
    validations:
      required: true
  - type: textarea
    id: tutor_rules
    attributes:
      label: Tutor rules
      description: Any special coaching constraints.
      value: |
        The student Codex should coach with hints first and should not submit a complete final solution without learner participation.
    validations:
      required: true

