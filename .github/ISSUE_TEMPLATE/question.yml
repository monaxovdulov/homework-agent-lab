name: Вопрос ученика или учителя
description: Задать вопрос по домашнему заданию.
title: "[question][ПОЗЫВНОЙ] "
labels:
  - kind:question
  - статус:ждет-ученика 🕯️
  - privacy:public-safe
body:
  - type: input
    id: callsign
    attributes:
      label: Позывной ученика
      description: Публичный псевдоним ученика, если вопрос связан с учеником.
      placeholder: alpha-17
    validations:
      required: false
  - type: input
    id: related_issue
    attributes:
      label: Связанная домашка
      placeholder: "#12"
    validations:
      required: false
  - type: textarea
    id: question
    attributes:
      label: Вопрос
      description: Что нужно уточнить?
    validations:
      required: true
